name: Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check JavaScript syntax
        run: find assets -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate generated navigation paths
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');

          const source = fs.readFileSync('assets/app.js', 'utf8');
          const repositoryPath = '/wellmax/';
          const cases = [
            ['/wellmax/', 'en', 'index.html'],
            ['/wellmax/index.html', 'en', 'index.html'],
            ['/wellmax/peptides/retatrutide.html', 'en', 'peptides/retatrutide.html'],
            ['/wellmax/biomarkers/hba1c.html', 'en', 'biomarkers/hba1c.html'],
            ['/wellmax/supplements/omega-3.html', 'en', 'supplements/omega-3.html'],
            ['/wellmax/pt/', 'pt', 'index.html'],
            ['/wellmax/pt/peptides/retatrutide.html', 'pt', 'peptides/retatrutide.html'],
            ['/wellmax/pt/biomarkers/hba1c.html', 'pt', 'biomarkers/hba1c.html'],
            ['/wellmax/pt/supplements/omega-3.html', 'pt', 'supplements/omega-3.html'],
            ['/wellmax/es/', 'es', 'index.html'],
            ['/wellmax/es/peptides/retatrutide.html', 'es', 'peptides/retatrutide.html'],
            ['/wellmax/es/biomarkers/hba1c.html', 'es', 'biomarkers/hba1c.html'],
            ['/wellmax/es/supplements/omega-3.html', 'es', 'supplements/omega-3.html']
          ];

          const pagePath = (locale, page) => {
            const prefix = locale === 'en' ? '' : `${locale}/`;
            return `${repositoryPath}${prefix}${page === 'index.html' ? '' : page}`;
          };

          for (const [pathname, locale, contentPath] of cases) {
            const header = { innerHTML: '' };
            const document = {
              currentScript: { src: 'https://site-solutions-pro.github.io/wellmax/assets/app.js' },
              querySelector: (selector) => selector === '.site-header' ? header : null,
              querySelectorAll: () => [],
              addEventListener: () => {}
            };
            const window = {
              location: { pathname },
              clearInterval: () => {},
              setInterval: () => 0,
              matchMedia: () => ({ matches: true })
            };

            vm.runInNewContext(source, { URL, document, window, HTMLAnchorElement: class {} });

            const actual = [...header.innerHTML.matchAll(/href="([^"]+)"/g)].map((match) => match[1]);
            const expected = [
              pagePath(locale, 'index.html'),
              pagePath(locale, 'explore.html'),
              pagePath(locale, 'library.html'),
              pagePath(locale, 'biomarkers.html'),
              pagePath(locale, 'comparisons.html'),
              pagePath(locale, 'membership.html'),
              pagePath('en', contentPath),
              pagePath('pt', contentPath),
              pagePath('es', contentPath)
            ];
            assert.deepEqual(actual, expected, `generated navigation mismatch for ${pathname}`);
            for (const href of actual) {
              assert.ok(href.startsWith(repositoryPath), `navigation escapes repository base: ${href}`);
              const relative = href.slice(repositoryPath.length);
              const target = relative === '' || relative.endsWith('/') ? `${relative}index.html` : relative;
              assert.ok(fs.existsSync(target), `generated navigation target missing: ${href} -> ${target}`);
            }
          }

          console.log(`Validated generated navigation for ${cases.length} root and nested locale paths.`);
          JS

      - name: Validate global language selector consistency
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const vm = require('node:vm');

          const appSource = fs.readFileSync('assets/app.js', 'utf8');
          const i18nSource = fs.readFileSync('assets/i18n-page.js', 'utf8');
          const sharedCss = fs.readFileSync('assets/styles.css', 'utf8');
          const homepageCss = fs.readFileSync('assets/wellmax.css', 'utf8');
          const canonicalSvg = '<svg class="language-globe" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.4 2.5 3.6 5.5 3.6 9S14.4 18.5 12 21M12 3C9.6 5.5 8.4 8.5 8.4 12S9.6 18.5 12 21"></path></svg>';
          const cases = [
            ['/wellmax/', 'en'],
            ['/wellmax/peptides/retatrutide.html', 'en'],
            ['/wellmax/biomarkers/hba1c.html', 'en'],
            ['/wellmax/supplements/omega-3.html', 'en'],
            ['/wellmax/pt/', 'pt'],
            ['/wellmax/pt/peptides/retatrutide.html', 'pt'],
            ['/wellmax/pt/biomarkers/hba1c.html', 'pt'],
            ['/wellmax/pt/supplements/omega-3.html', 'pt'],
            ['/wellmax/es/', 'es'],
            ['/wellmax/es/peptides/retatrutide.html', 'es'],
            ['/wellmax/es/biomarkers/hba1c.html', 'es'],
            ['/wellmax/es/supplements/omega-3.html', 'es']
          ];
          const shellCases = [
            ['pt/biomarkers.html', '/wellmax/pt/biomarkers.html', 'pt', 'biomarkers.html'],
            ['pt/comparisons.html', '/wellmax/pt/comparisons.html', 'pt', 'comparisons.html'],
            ['pt/health-hub.html', '/wellmax/pt/health-hub.html', 'pt', 'health-hub.html'],
            ['pt/membership.html', '/wellmax/pt/membership.html', 'pt', 'membership.html'],
            ['es/biomarkers.html', '/wellmax/es/biomarkers.html', 'es', 'biomarkers.html'],
            ['es/comparisons.html', '/wellmax/es/comparisons.html', 'es', 'comparisons.html'],
            ['es/health-hub.html', '/wellmax/es/health-hub.html', 'es', 'health-hub.html'],
            ['es/membership.html', '/wellmax/es/membership.html', 'es', 'membership.html']
          ];

          for (const [pathname, locale] of cases) {
            const header = { innerHTML: '' };
            const document = {
              currentScript: { src: 'https://site-solutions-pro.github.io/wellmax/assets/app.js' },
              querySelector: (selector) => selector === '.site-header' ? header : null,
              querySelectorAll: () => [],
              addEventListener: () => {}
            };
            const window = {
              location: { pathname },
              clearInterval: () => {},
              setInterval: () => 0,
              matchMedia: () => ({ matches: true })
            };

            vm.runInNewContext(appSource, { URL, document, window, HTMLAnchorElement: class {} });
            assert.ok(header.innerHTML.includes(canonicalSvg), `non-canonical globe SVG for ${pathname}`);
            assert.match(header.innerHTML, /<button class="language-button"[^>]+aria-expanded="false"[^>]+aria-haspopup="true"[^>]+aria-label="[^"]+">/);
            assert.match(header.innerHTML, /<div class="language-dropdown" role="menu" hidden>/);
            assert.equal((header.innerHTML.match(/class="active"/g) || []).length, 1, `active language count for ${pathname}`);
            assert.match(header.innerHTML, new RegExp(`class="active" href="[^"]+" data-language="${locale}"`));
          }

          for (const [file, pathname, locale, contentPath] of shellCases) {
            const shell = fs.readFileSync(file, 'utf8');
            const dataset = Object.fromEntries(
              [...shell.matchAll(/data-([a-z0-9-]+)="([^"]+)"/g)]
                .map(([, key, value]) => [key.replace(/-([a-z])/g, (_, letter) => letter.toUpperCase()), value])
            );
            const stylesheetHref = shell.match(/<link[^>]+href="([^"]*assets\/styles\.css)"/)?.[1];
            assert.ok(stylesheetHref, `${file} does not load shared selector CSS`);
            assert.equal(
              new URL(stylesheetHref, `https://site-solutions-pro.github.io${pathname}`).pathname,
              '/wellmax/assets/styles.css',
              `${file} does not resolve to shared selector CSS`
            );
            assert.ok(shell.includes('assets/i18n-page.js'), `${file} does not use the shared i18n renderer`);
            assert.ok(!shell.includes('language-globe'), `${file} contains a page-specific globe`);
            assert.ok(!shell.includes('language-button'), `${file} contains a page-specific selector button`);

            const header = { innerHTML: '' };
            let rootMarkup = '';
            let appendedAppScript = null;
            const root = {};
            Object.defineProperty(root, 'innerHTML', {
              set(value) { rootMarkup = value; },
              get() { return rootMarkup; }
            });
            const document = {
              body: {
                dataset,
                append(node) { appendedAppScript = node; }
              },
              currentScript: { src: 'https://site-solutions-pro.github.io/wellmax/assets/i18n-page.js' },
              head: { append: () => {} },
              createElement: (tagName) => ({ tagName: tagName.toUpperCase() }),
              getElementById: (id) => id === 'i18n-root' ? root : null,
              querySelector: (selector) => selector === '.site-header' && rootMarkup.includes('class="site-header"') ? header : null,
              querySelectorAll: () => [],
              addEventListener: () => {}
            };
            const window = {
              location: { pathname },
              clearInterval: () => {},
              setInterval: () => 0,
              matchMedia: () => ({ matches: true })
            };

            vm.runInNewContext(i18nSource, { URL, document, window });
            assert.ok(appendedAppScript, `${file} did not invoke the app.js renderer`);
            assert.equal(
              new URL(appendedAppScript.src).pathname,
              '/wellmax/assets/app.js',
              `${file} invoked the wrong shared renderer`
            );
            document.currentScript = { src: appendedAppScript.src };
            vm.runInNewContext(appSource, { URL, document, window, HTMLAnchorElement: class {} });

            assert.ok(header.innerHTML.includes(canonicalSvg), `${file} runtime globe is not canonical`);
            assert.match(header.innerHTML, /<button class="language-button"[^>]+aria-expanded="false"[^>]+aria-haspopup="true"[^>]+aria-label="[^"]+">/);
            assert.match(header.innerHTML, /<div class="language-dropdown" role="menu" hidden>/);
            assert.equal((header.innerHTML.match(/class="active"/g) || []).length, 1, `${file} active language count`);
            assert.match(header.innerHTML, new RegExp(`class="active" href="[^"]+" data-language="${locale}"`));

            const languageLinks = Object.fromEntries(
              [...header.innerHTML.matchAll(/href="([^"]+)" data-language="(en|pt|es)"/g)]
                .map(([, href, language]) => [language, href])
            );
            assert.deepEqual(languageLinks, {
              en: `/wellmax/${contentPath}`,
              pt: `/wellmax/pt/${contentPath}`,
              es: `/wellmax/es/${contentPath}`
            }, `${file} does not preserve content identity across locales`);
          }

          const htmlFiles = [];
          const visit = (directory) => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (entry.name === '.git') continue;
              const target = path.join(directory, entry.name);
              if (entry.isDirectory()) visit(target);
              if (entry.isFile() && entry.name.endsWith('.html')) htmlFiles.push(target);
            }
          };
          visit('.');

          for (const file of htmlFiles) {
            const html = fs.readFileSync(file, 'utf8');
            const usesApp = /assets\/app\.js/.test(html);
            const usesI18nShell = /assets\/i18n-page\.js/.test(html);
            assert.ok(usesApp || usesI18nShell, `${file} has no shared header renderer`);
            if (html.includes('data-language-menu')) {
              assert.ok(html.includes(canonicalSvg), `${file} contains non-canonical static globe markup`);
              assert.ok(html.includes('class="language-button"'), `${file} static selector lacks language-button`);
            }
          }

          assert.ok(i18nSource.includes("new URL('app.js',document.currentScript.src)"), 'i18n shell does not delegate to app.js');
          for (const selector of ['.language-menu', '.language-button', '.language-globe', '.language-dropdown']) {
            assert.ok(sharedCss.includes(selector), `shared selector CSS missing ${selector}`);
            assert.ok(!homepageCss.includes(selector), `homepage CSS still overrides ${selector}`);
          }

          console.log(`Validated the canonical language selector on ${cases.length} representative routes, ${shellCases.length} generated localized hubs and all ${htmlFiles.length} public HTML files.`);
          console.log('Explicitly validated pt/comparisons.html through i18n-page.js -> app.js with PT active and reciprocal identity links.');
          JS

      - name: Validate Portuguese homepage localized links
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');

          const html = fs.readFileSync('pt/index.html', 'utf8');
          const expectedCounts = {
            'explore.html': 2,
            'library.html': 2,
            'biomarkers.html': 3,
            'comparisons.html': 1,
            'membership.html': 1,
            'peptides.html': 1,
            'longevity.html': 2,
            'metabolism.html': 1,
            'performance.html': 1,
            'neuroscience.html': 1
          };

          for (const [page, expectedCount] of Object.entries(expectedCounts)) {
            assert.ok(fs.existsSync(`pt/${page}`), `Portuguese equivalent missing: pt/${page}`);
            const localizedCount = [...html.matchAll(new RegExp(`href="${page}"`, 'g'))].length;
            assert.equal(localizedCount, expectedCount, `unexpected localized link count for ${page}`);
            assert.ok(!html.includes(`href="../${page}"`), `Portuguese homepage escapes to English: ../${page}`);
          }

          console.log('Validated 15 Portuguese homepage links across navigation, CTAs and category cards.');
          JS

      - name: Validate sitemap XML and static HTML integrity
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote
          import json
          import os
          import subprocess
          import xml.etree.ElementTree as ET

          root = Path('.')
          errors = []
          base_ref = os.environ.get('GITHUB_BASE_REF', 'main')
          try:
              changed = subprocess.check_output(['git','diff','--name-only',f'origin/{base_ref}...HEAD'], text=True).splitlines()
          except Exception:
              changed = []
          changed_html = {Path(p) for p in changed if p.endswith('.html')}

          sitemap = root / 'sitemap.xml'
          prefix = 'https://site-solutions-pro.github.io/wellmax/'
          try:
              tree = ET.parse(sitemap)
              ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
              locs = [el.text.strip() for el in tree.findall('.//sm:loc', ns) if el.text]
              if len(locs) != len(set(locs)):
                  errors.append('sitemap.xml contains duplicate <loc> entries')
              sitemap_targets = set()
              for url in locs:
                  if not url.startswith('https://'):
                      errors.append(f'non-HTTPS sitemap URL: {url}')
                  if not url.startswith(prefix):
                      errors.append(f'sitemap URL outside production base {prefix}: {url}')
                      continue
                  rel = unquote(url[len(prefix):])
                  target = root / rel
                  if rel == '' or rel.endswith('/'):
                      target = target / 'index.html'
                  if not target.is_file():
                      errors.append(f'sitemap target missing: {url} -> {target}')
                  else:
                      sitemap_targets.add(target.resolve())
          except Exception as exc:
              errors.append(f'sitemap.xml parse failure: {exc}')
              locs = []
              sitemap_targets = set()

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.ids = set()
                  self.jsonld = []
                  self._jsonld = False
                  self._buf = []
                  self.title_count = 0
                  self.h1_count = 0
                  self.canonicals = 0
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if 'id' in a:
                      self.ids.add(a['id'])
                  if tag == 'a' and 'href' in a:
                      self.links.append(a['href'])
                  if tag in ('script','link','img'):
                      key = {'script':'src','link':'href','img':'src'}[tag]
                      if a.get(key):
                          self.links.append(a[key])
                  if tag == 'script' and a.get('type') == 'application/ld+json':
                      self._jsonld = True
                      self._buf = []
                  if tag == 'title': self.title_count += 1
                  if tag == 'h1': self.h1_count += 1
                  if tag == 'link' and a.get('rel') == 'canonical': self.canonicals += 1
              def handle_endtag(self, tag):
                  if tag == 'script' and self._jsonld:
                      self._jsonld = False
                      self.jsonld.append(''.join(self._buf))
              def handle_data(self, data):
                  if self._jsonld: self._buf.append(data)

          html_files = sorted(root.rglob('*.html'))
          public_html = {path.resolve() for path in html_files}
          for path in sorted(public_html - sitemap_targets):
              errors.append(f'public HTML missing from sitemap.xml: {path.relative_to(root.resolve())}')
          for path in sorted(sitemap_targets - public_html):
              errors.append(f'sitemap target is not public HTML: {path.relative_to(root.resolve())}')

          expected_robots_sitemap = f'Sitemap: {prefix}sitemap.xml'
          robots_lines = [line.strip() for line in (root / 'robots.txt').read_text(encoding='utf-8').splitlines()]
          robots_sitemaps = [line for line in robots_lines if line.lower().startswith('sitemap:')]
          if robots_sitemaps != [expected_robots_sitemap]:
              errors.append(
                  f'robots.txt must contain exactly {expected_robots_sitemap!r}; found {robots_sitemaps!r}'
              )

          # Historical and migration documentation is intentionally excluded.
          # Active browser-delivered source must never point to the retired project URL.
          stale_production_url = 'site-solutions-pro.github.io/pepeducation/'
          active_files = [root / 'robots.txt', root / 'sitemap.xml', *html_files]
          active_files.extend(
              path for path in (root / 'assets').rglob('*')
              if path.is_file() and path.suffix.lower() in {'.css', '.js', '.svg'}
          )
          for path in active_files:
              if stale_production_url in path.read_text(encoding='utf-8'):
                  errors.append(f'active production file contains retired URL: {path}')

          parsed = {}
          for path in html_files:
              text = path.read_text(encoding='utf-8')
              p = Parser()
              try:
                  p.feed(text)
              except Exception as exc:
                  errors.append(f'{path}: HTML parser failure: {exc}')
                  continue
              parsed[path] = p

              dynamic_shell = 'assets/i18n-page.js' in text
              strict = not dynamic_shell and (
                  path in changed_html or (path.parent == Path('pt') and path.name != 'index.html')
              )
              if strict:
                  # Preserve strict checks for new/compliant pages while allowing a
                  # scoped UI change to leave documented legacy metadata debt unchanged.
                  baseline = None
                  baseline_parser = None
                  if path in changed_html:
                      try:
                          baseline = subprocess.check_output(
                              ['git', 'show', f'origin/{base_ref}:{path.as_posix()}'],
                              text=True,
                              encoding='utf-8'
                          )
                          baseline_parser = Parser()
                          baseline_parser.feed(baseline)
                      except Exception:
                          baseline = None
                          baseline_parser = None

                  doctype_valid = text.lstrip().startswith('<!DOCTYPE html>')
                  baseline_doctype_valid = baseline is not None and baseline.lstrip().startswith('<!DOCTYPE html>')
                  if not doctype_valid and (baseline is None or baseline_doctype_valid):
                      errors.append(f'{path}: missing canonical HTML5 doctype')
                  if p.title_count != 1 and (baseline_parser is None or baseline_parser.title_count == 1):
                      errors.append(f'{path}: expected exactly one <title>, found {p.title_count}')
                  if p.h1_count != 1 and (baseline_parser is None or baseline_parser.h1_count == 1):
                      errors.append(f'{path}: expected exactly one <h1>, found {p.h1_count}')
                  if p.canonicals != 1 and (baseline_parser is None or baseline_parser.canonicals == 1):
                      errors.append(f'{path}: expected exactly one canonical link, found {p.canonicals}')

              for block in p.jsonld:
                  try:
                      json.loads(block)
                  except Exception as exc:
                      errors.append(f'{path}: invalid JSON-LD: {exc}')

          for path, p in parsed.items():
              base = path.parent
              for href in p.links:
                  if not href or href.startswith(('http://','https://','mailto:','tel:','javascript:','data:')):
                      continue
                  if href.startswith('#'):
                      frag = href[1:]
                      if frag and frag not in p.ids:
                          errors.append(f'{path}: missing fragment target #{frag}')
                      continue
                  clean = href.split('#',1)[0].split('?',1)[0]
                  if not clean:
                      continue
                  target = (base / clean).resolve()
                  try:
                      target.relative_to(root.resolve())
                  except ValueError:
                      errors.append(f'{path}: local link escapes repository: {href}')
                      continue
                  if clean.endswith('/'):
                      target = target / 'index.html'
                  if not target.exists():
                      errors.append(f'{path}: missing local target {href}')

          if errors:
              print('\n'.join(f'ERROR: {e}' for e in errors))
              raise SystemExit(1)
          print(f'Validated {len(html_files)} HTML files, {len(changed_html)} changed HTML files and {len(locs)} sitemap URLs successfully.')
          PY

      - name: Check diff whitespace
        run: git diff --check origin/${{ github.base_ref }}...HEAD
